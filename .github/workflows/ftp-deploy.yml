name: Deploy via FTP

# Sincroniza os arquivos do repo com o servidor FTP toda vez que houver push
# no main (incluindo o sync-seo automatizado, que tambem commita ali).
# Tambem pode ser disparado manualmente via "Run workflow" na aba Actions.
#
# Roda em self-hosted runner Windows (PC do Fernando), via WinSCP CLI.
# Toda a logica fica em scripts/deploy-ftp.ps1.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    environment: FTP
    concurrency:
      group: ftp-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync via WinSCP
        shell: powershell
        env:
          # Quando FTP_STORED_SESSION estiver definida, o script ignora os demais
          # campos e usa a sessao salva no registro do WinSCP do usuario do runner.
          FTP_STORED_SESSION: ${{ vars.FTP_STORED_SESSION }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          ./scripts/deploy-ftp.ps1
